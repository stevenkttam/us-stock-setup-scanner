name: Data Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run diagnostic smoke test
        env:
          SCANNER_MAX_SYMBOLS: "25"
          SCANNER_PERIOD: "2y"
          PYTHONUNBUFFERED: "1"
        run: python scripts/data_smoke_test.py
      - name: Summarize result
        if: success()
        run: |
          python - <<'PY'
          import pandas as pd
          d = pd.read_parquet("data/training_signals_smoke.parquet")
          print(f"Smoke-test labelled setups: {len(d):,}")
          if not d.empty:
              print(d.groupby("Direction")["Outcome"].agg(["count","mean"]))
          PY
