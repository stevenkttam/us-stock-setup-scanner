name: Research V12 EOD Cross-Sectional Ranking - Fresh 1000 Stocks / 10 Years

on:
  push:
    branches: [main]
    paths:
      - "scripts/eod_ranking_v12.py"
      - ".github/workflows/eod_ranking_v12.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      SCANNER_MAX_SYMBOLS: "1000"
      SCANNER_BATCH_SIZE: "50"
      SCANNER_PERIOD: "10y"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run V12 EOD ranking research
        run: python scripts/eod_ranking_v12.py
      - name: Upload V12 research results
        uses: actions/upload-artifact@v7
        with:
          name: eod-ranking-v12-fresh-1000-10y
          path: artifacts/eod_ranking_v12/
          retention-days: 14
