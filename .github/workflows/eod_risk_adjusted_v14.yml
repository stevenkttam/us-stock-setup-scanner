name: Research V14 EOD Risk-Adjusted Continuous Return Ranking - Fresh 1000 Stocks / 10 Years

on:
  push:
    branches: [main]
    paths:
      - "scripts/eod_risk_adjusted_v14.py"
      - ".github/workflows/eod_risk_adjusted_v14.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      SCANNER_MAX_SYMBOLS: "1000"
      SCANNER_BATCH_SIZE: "50"
      SCANNER_PERIOD: "10y"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run V14 continuous risk-adjusted ranking research
        run: python scripts/eod_risk_adjusted_v14.py
      - name: Publish primary results to workflow summary
        run: |
          python - <<'PY'
          import json, os, pathlib, pandas as pd
          root=pathlib.Path("artifacts/eod_risk_adjusted_v14")
          s=json.loads((root/"summary.json").read_text())
          ci=pd.read_csv(root/"primary_holdout_confidence_intervals.csv")
          ic=pd.read_csv(root/"holdout_ic_summary.csv")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("# V14 EOD Risk-Adjusted Continuous Ranking\n\n")
              f.write(f"- Fresh symbols requested/downloaded: {s['symbols_requested']} / {s['symbols_downloaded']}\n")
              f.write(f"- Eligible tickers / dates: {s['eligible_tickers']} / {s['unique_dates']}\n")
              f.write(f"- Primary target: {s['target']}\n")
              f.write("- Primary portfolio: equal-weight Top 40 Long / Bottom 40 Short, five-session horizon.\n\n")
              f.write("| Direction | Ranking | Dates | Mean daily trade return | Mean daily alpha vs SPY | 95% block-bootstrap CI | Positive alpha supported? |\n")
              f.write("|---|---|---:|---:|---:|---:|---|\n")
              for _,r in ci.iterrows():
                  ret="n/a" if pd.isna(r.MeanDailyTradeReturn) else f"{r.MeanDailyTradeReturn:.2%}"
                  f.write(f"| {r.Direction} | {r.Ranking} | {int(r.Dates)} | {ret} | {r.MeanDailyAlphaVsSPY:.2%} | [{r.AlphaCI95Low:.2%}, {r.AlphaCI95High:.2%}] | {'Yes' if r.PositiveAlphaSupported else 'No'} |\n")
              f.write("\n## Holdout ranking information coefficient\n\n")
              f.write("| Ranking | Dates | Mean daily IC | ICIR | Positive IC dates |\n|---|---:|---:|---:|---:|\n")
              for _,r in ic.iterrows():
                  f.write(f"| {r.Ranking} | {int(r.Dates)} | {r.MeanIC:.4f} | {r.ICIR:.3f} | {r.PositiveICPct:.1%} |\n")
              f.write("\nResearch only. Scores are not probabilities; no production probabilities or A-tier labels are enabled. Results are gross and omit costs, slippage, short borrow fees, and point-in-time universe bias.\n")
          PY
      - name: Upload V14 research results
        uses: actions/upload-artifact@v7
        with:
          name: eod-risk-adjusted-v14-fresh-1000-10y
          path: artifacts/eod_risk_adjusted_v14/
          retention-days: 30
