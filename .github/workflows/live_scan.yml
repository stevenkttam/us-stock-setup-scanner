name: Live Daily Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/run_live_scan.py"
      - "scanner/**"
      - "app.py"
      - ".github/workflows/live_scan.yml"
  schedule:
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run research-only daily ranking
        run: python scripts/run_live_scan.py
      - name: Commit latest scan and status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_scan.parquet artifacts/live_scan_status.json
          git diff --cached --quiet || git commit -m "Refresh daily research-only scan"
          git push
