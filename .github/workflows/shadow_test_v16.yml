name: V16 Prospective QC Shadow Test

on:
  push:
    branches:
      - main
    paths:
      - "scripts/update_shadow_test_v16.py"
      - "scripts/run_live_scan.py"
      - "scanner/**"
      - "tests/**"
      - "config.yaml"
      - "app.py"
      - ".github/workflows/shadow_test_v16.yml"
  workflow_run:
    workflows: ["Live Daily Scan"]
    types: [completed]

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile shadow tracker and Streamlit dashboard
        run: python -m py_compile scripts/update_shadow_test_v16.py app.py
      - name: Smoke test Streamlit dashboard startup
        run: |
          streamlit run app.py --server.headless true --server.port 8501 --browser.gatherUsageStats false > /tmp/streamlit.log 2>&1 &
          STREAMLIT_PID=$!
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:8501/_stcore/health >/dev/null; then
              kill "$STREAMLIT_PID" || true
              wait "$STREAMLIT_PID" 2>/dev/null || true
              echo "Streamlit startup smoke test passed."
              exit 0
            fi
            if ! kill -0 "$STREAMLIT_PID" 2>/dev/null; then
              cat /tmp/streamlit.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          kill "$STREAMLIT_PID" || true
          exit 1
      - name: Test free market-cap lookup and fail-closed filter
        run: python tests/test_live_scan.py
      - name: Test dates, matched returns, costs, and QC labels
        run: python tests/test_shadow_tracker_v16.py

  track:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      SHADOW_ADD_NEW_SIGNALS: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'success' && 'true' || 'false' }}
      SHADOW_EXPECTED_SIGNAL_DATE: ${{ github.event.workflow_run.created_at || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile tracker before execution
        run: python -m py_compile scripts/update_shadow_test_v16.py
      - name: Update prospective signal ledger and outcomes
        run: python scripts/update_shadow_test_v16.py
      - name: Commit the shadow ledger and summaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shadow artifacts/shadow_test_status.json artifacts/shadow_test_v16
          if ! git diff --cached --quiet; then
            git commit -m "Update prospective QC shadow test ledger"
          fi
          git pull --rebase origin main
          git push
      - name: Upload this run's status and portfolio summaries
        uses: actions/upload-artifact@v7
        with:
          name: shadow-test-v16-${{ github.run_id }}
          path: |
            artifacts/shadow_test_status.json
            artifacts/shadow_test_v16/status.json
            artifacts/shadow_test_v16/report.md
            data/shadow/shadow_daily_portfolios.csv
            data/shadow/shadow_group_summary.csv
            data/shadow/shadow_qc_comparisons.csv
          if-no-files-found: warn
          retention-days: 90
