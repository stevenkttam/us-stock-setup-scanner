name: VCP Sensitivity Discovery V7 - 500 Stocks / 3 Years

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      SCANNER_MAX_SYMBOLS: "500"
      SCANNER_BATCH_SIZE: "50"
      SCANNER_PERIOD: "3y"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run VCP sensitivity discovery
        run: python scripts/vcp_sensitivity_v7.py
      - name: Upload V7 results
        uses: actions/upload-artifact@v7
        with:
          name: vcp-sensitivity-v7-500-3y
          path: artifacts/vcp_sensitivity_v7/
          retention-days: 7
